<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuração - Lily Bot</title>
    <style>
        :root {
            --discord-blurple: #5865F2;
            --discord-dark: #36393F;
            --discord-darker: #2F3136;
        }
        
        body {
            font-family: 'Whitney', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: var(--discord-dark);
            color: white;
            margin: 0;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .server-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .server-card {
            background-color: var(--discord-darker);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .server-card:hover {
            transform: translateY(-3px);
        }
        
        .server-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin-right: 15px;
            object-fit: cover;
        }
        
        .server-name {
            font-weight: 600;
            font-size: 1.1em;
        }
        
        .config-section {
            background-color: var(--discord-darker);
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
            display: none;
        }
        
        .channel-select {
            width: 100%;
            padding: 10px;
            background-color: #40444B;
            color: white;
            border: none;
            border-radius: 4px;
            margin: 10px 0;
        }
        
        .btn {
            background-color: var(--discord-blurple);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            margin-top: 15px;
        }
        
        .btn:hover {
            background-color: #4752C4;
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Selecione um Servidor</h1>
        <div id="server-list" class="server-list">
            <!-- Servidores serão carregados aqui -->
            <div class="loading">Carregando seus servidores...</div>
        </div>
        
        <div id="config-section" class="config-section">
            <h2>Configuração do <span id="current-server-name"></span></h2>
            
            <h3>Mensagem de Boas-vindas</h3>
            <textarea id="welcome-message" rows="4" placeholder="Digite a mensagem de boas-vindas..."></textarea>
            
            <h3>Canal de Boas-vindas</h3>
            <select id="welcome-channel" class="channel-select">
                <option value="">Selecione um canal</option>
                <!-- Canais serão carregados aqui -->
            </select>
            
            <h3>Sistema de Tickets</h3>
            <label>
                <input type="checkbox" id="enable-tickets"> Ativar sistema de tickets
            </label>
            
            <div id="ticket-options" style="margin-top: 15px; display: none;">
                <h4>Categoria para Tickets</h4>
                <select id="ticket-category" class="channel-select">
                    <option value="">Selecione uma categoria</option>
                    <!-- Categorias serão carregadas aqui -->
                </select>
                
                <h4>Mensagem de Abertura</h4>
                <textarea id="ticket-message" rows="3" placeholder="Digite a mensagem para o painel de tickets..."></textarea>
            </div>
            
            <button id="save-btn" class="btn">Salvar Configurações</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('discord_token');
            if (!token) {
                window.location.href = '/';
                return;
            }

            // Carrega servidores do usuário
            try {
                const response = await fetch('https://discord.com/api/users/@me/guilds', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (!response.ok) throw new Error('Erro ao carregar servidores');
                
                const guilds = await response.json();
                displayGuilds(guilds);
            } catch (error) {
                console.error('Erro:', error);
                document.getElementById('server-list').innerHTML = 
                    `<div class="error">Erro ao carregar servidores. <a href="/">Tente novamente</a></div>`;
            }
        });

        function displayGuilds(guilds) {
            const serverList = document.getElementById('server-list');
            serverList.innerHTML = '';
            
            guilds.forEach(guild => {
                const serverCard = document.createElement('div');
                serverCard.className = 'server-card';
                serverCard.innerHTML = `
                    <img src="${guild.icon ? 
                        `https://cdn.discordapp.com/icons/${guild.id}/${guild.icon}.png` : 
                        'https://discord.com/assets/1f0bfc0865d324c2587920a7d80c609b.png'}" 
                        class="server-icon" alt="${guild.name}">
                    <div class="server-name">${guild.name}</div>
                `;
                
                serverCard.addEventListener('click', () => loadServerConfig(guild));
                serverList.appendChild(serverCard);
            });
        }

        async function loadServerConfig(guild) {
            const token = localStorage.getItem('discord_token');
            document.getElementById('current-server-name').textContent = guild.name;
            
            // Mostra a seção de configuração
            document.getElementById('config-section').style.display = 'block';
            
            // Carrega canais do servidor
            try {
                const response = await fetch(`/api/channels?guild_id=${guild.id}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (!response.ok) throw new Error('Erro ao carregar canais');
                
                const channels = await response.json();
                populateChannelSelects(channels, guild.id);
                
                // Carrega configurações salvas (se existirem)
                loadSavedConfig(guild.id);
            } catch (error) {
                console.error('Erro:', error);
                alert('Erro ao carregar configurações do servidor');
            }
        }

        function populateChannelSelects(channels, guildId) {
            const welcomeSelect = document.getElementById('welcome-channel');
            const categorySelect = document.getElementById('ticket-category');
            
            // Limpa selects
            welcomeSelect.innerHTML = '<option value="">Selecione um canal</option>';
            categorySelect.innerHTML = '<option value="">Selecione uma categoria</option>';
            
            // Filtra e organiza canais
            const textChannels = channels.filter(c => c.type === 0); // TEXT_CHANNEL
            const categories = channels.filter(c => c.type === 4); // CATEGORY
            
            // Preenche selects
            textChannels.forEach(channel => {
                const option = document.createElement('option');
                option.value = channel.id;
                option.textContent = `#${channel.name}`;
                welcomeSelect.appendChild(option);
            });
            
            categories.forEach(category => {
                const option = document.createElement('option');
                option.value = category.id;
                option.textContent = category.name;
                categorySelect.appendChild(option);
            });
        }

        function loadSavedConfig(guildId) {
            // Aqui você implementaria a busca das configurações salvas
            // Exemplo mockado:
            const savedConfig = {
                welcomeMessage: "Bem-vindo {user} ao servidor!",
                welcomeChannel: "123456789",
                ticketsEnabled: true,
                ticketCategory: "987654321",
                ticketMessage: "Clique para abrir um ticket!"
            };
            
            document.getElementById('welcome-message').value = savedConfig.welcomeMessage;
            document.getElementById('welcome-channel').value = savedConfig.welcomeChannel;
            document.getElementById('enable-tickets').checked = savedConfig.ticketsEnabled;
            document.getElementById('ticket-category').value = savedConfig.ticketCategory;
            document.getElementById('ticket-message').value = savedConfig.ticketMessage;
            
            // Mostra/oculta opções de tickets
            document.getElementById('enable-tickets').addEventListener('change', function() {
                document.getElementById('ticket-options').style.display = 
                    this.checked ? 'block' : 'none';
            });
            
            // Dispara evento para mostrar se já está marcado
            if (savedConfig.ticketsEnabled) {
                document.getElementById('ticket-options').style.display = 'block';
            }
        }

        document.getElementById('save-btn').addEventListener('click', async function() {
            const guildId = /* ID do servidor selecionado */;
            const config = {
                welcomeMessage: document.getElementById('welcome-message').value,
                welcomeChannel: document.getElementById('welcome-channel').value,
                ticketsEnabled: document.getElementById('enable-tickets').checked,
                ticketCategory: document.getElementById('ticket-category').value,
                ticketMessage: document.getElementById('ticket-message').value
            };
            
            try {
                const response = await fetch('/api/save-config', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('discord_token')}`
                    },
                    body: JSON.stringify({ guildId, config })
                });
                
                if (response.ok) {
                    alert('Configurações salvas com sucesso!');
                } else {
                    throw new Error('Erro ao salvar');
                }
            } catch (error) {
                console.error('Erro:', error);
                alert('Erro ao salvar configurações');
            }
        });
    </script>
</body>
</html>
