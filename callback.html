<!DOCTYPE html>
<html>
<head>
    <title>Processando login...</title>
    <script>
        // Extrai o código da URL
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        
        if (code) {
            // Envia o código para o backend
            fetch(`/api/auth?code=${encodeURIComponent(code)}`)
                .then(response => response.json())
                .then(data => {
                    if (data.token) {
                        localStorage.setItem('discord_token', data.token);
                        window.location.href = '/guild.html';
                    } else {
                        window.location.href = '/?error=auth_failed';
                    }
                })
                .catch(() => {
                    window.location.href = '/?error=server_error';
                });
        } else {
            window.location.href = '/?error=no_code';
        }
    </script>
</head>
<body>
    <p>Processando autenticação com Discord...</p>
</body>
</html>
